name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Determine version
        id: version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not determine version from tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; the release APK will be signed with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Keystore is configured but one of ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "HABITAT_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "HABITAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "HABITAT_KEY_ALIAS=$KEY_ALIAS"
            echo "HABITAT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Prepare release files
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          mkdir -p dist
          APK_NAME="habitat-android-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "$APK_NAME" > "${APK_NAME}.sha256")
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitat-android-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Habitat Android ${{ steps.version.outputs.name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Habitat Android release"
            echo ""
            echo "- Version: \`${{ steps.version.outputs.name }}\`"
            echo "- Version code: \`${{ steps.version.outputs.code }}\`"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "- Signed with the configured release keystore"
            else
              echo "- **Signed with the debug key** (no release keystore configured)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
